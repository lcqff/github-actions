name: needs
on: push

jobs:
  # Job은 기본적으로 병렬 실행된다.
    # job1과 job2는 동시에 실행된다.
  # needs로 Job간 종속성을 만들 수 있다.
    # Job1 실행 성공 후 job2가 실행된다.
    # job3은 강제 실패 되기에 job4가 실행되지 않는다.
      # 실패하더라도 종속성있는 job을 실행하기 위해선 if condition 설정 필요

  job1:
    runs-on: ubuntu-latest
    steps:
      - name: echo
        run: echo "job1 done"
  job2:
    runs-on: ubuntu-latest
    needs:
      - job1
    steps:
      - name: echo
        run: echo "job2 done"

 # 강제 실패
  job3:
    runs-on: ubuntu-latest
    steps:
      - name: echo
        run: | 
          echo "job3 failed" 
          exit 1
  job4:
    runs-on: ubuntu-latest
    needs:
      - job3
    steps:
      - name: echo
        run: echo "job4 done"
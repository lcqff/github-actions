# 여러 한 job에서 생성된 데이터를 다른 step과 job에 전달
  # 단순한 값 전달 시 사용
  # key-value 형태로 데이터 저장
# 다른 step의 output 사용하기
  # output이 정의된 step: 고유 id를 설정
    # key값 중복 가능 / 스텝 id 중복 불가
# 다른 job의 output 사용하기
  # output이 정의된 job: job level output 설정
  # output을 사용하는 job: needs로 output이 정의된 job에 대한 종속성 설정

name: output
on: push

jobs:
  create-output:
    runs-on: ubuntu-latest
    # 다른 job에서 사용하기 위한 job level output 설정
    outputs:
      # {key}: {output}
      test: ${{ steps.check-output.outputs.test }}
    steps:
      - name: echo output
        id: check-output
        # output 저장
        # Key: test, Value: hello
        run: |
          echo "test=hello" >> $GITHUB_OUTPUT
      - name: check output
        # 다른 스텝의 output 출력
        # steps.{step id}.outputs.{output key}
        run: |
          echo ${{ steps.check-output.outputs.test }} 

  get-output:
    needs: [create-output] # 종속성 설정
    runs-on: ubuntu-latest
    steps:
      - name: get output
        # 다른 Job의 아웃풋 출력
        # needs.{job id}.outputs.{key}
        run: echo ${{ needs.create-output.outputs.test }}

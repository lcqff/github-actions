# 워크플로우 실행 중 생성된 파일
# 동일한 워크플로우 내에서 Job 사이에 데이터 공유
# 워크플로우가 종료된 후에도 90일간 데이터 유지

name: artifact
on: push

jobs:
  upload-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: echo
        run: echo hello-world > hello.txt
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-test
          path: ./hello.txt

  download-artifiact:
    runs-on: ubuntu-latest
    needs: [upload-artifact] # 종속성 설정
    steps:
      - name: download artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact-test
          path: ./
      - name: check
        run: cat hello.txt
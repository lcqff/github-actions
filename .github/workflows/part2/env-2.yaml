# Repository -> Setting -> Secret and Variables -> action -> variables 에서 환경 변수 미리 설정 가능
  # organization, repository, environment에서 설정 가능
  # 우선순위: environment level >> Repository level >> Organization level

name: env-2
on: push

jobs:
  get-var:
    runs-on: ubuntu-latest
    steps:
      - name: get var
        run: echo ${{ vars.level }} # 미리 정의된 환경변수 LEVEL 가져옴
# 동일한 Job에서 공유 가능
# key-value 형태로 데이터 저장
# env 사용(워크플로우 내에서 정의) or 미리 정의해놓고 사용

# env 사용
 # job levevl, step level, workflow level 정의 가능
 # 우선순위: step >> job >> workflow

name: env-1
on: push

env:
  level: workflow

jobs:
  get-env-1:
    runs-on: ubuntu-latest
    steps:
      - name: check env
        run: echo "LEVEL ${{ env.level }}" # workflow 레벨의 env 출력

  get-env-2:
    runs-on: ubuntu-latest
    env:
      level: job
    steps:
      - name: check env
        run: echo "LEVEL ${{ env.level }}" # Job 레벨의 env 출력

  get-env-3:
    runs-on: ubuntu-latest
    env:
      level: job
    steps:
      - name: check env
        run: echo "LEVEL ${{ env.level }}" # step 레벨의 env 출력
        env:
          level: step

  get-env:
    runs-on: ubuntu-latest
    env:
      level: job
    steps:
      - name: create env
        run: echo "level=job" >> $GITHUB_ENV # env 저장
      - name: check env
        run: echo "LEVEL ${{ env.level }}"
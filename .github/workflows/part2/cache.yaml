# 동일한 운영체제에서 동일한 package.json을 지닌 워크플로우 실행 시 캐시 사용
name: cache.yaml

on:
  push:
      paths:
        - 'my-app/**'

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # 18버전 Node 섪치
      - name: setup-node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Path, key, restore-keys를 인풋값으로 전달
      - name: Cach Node.js modules
        uses: actions/cache@v3
        with:
          path: ~/.npm # 캐싱 경로 ~에 .npm 폴더 저장
          # ${{ runner.os }}: 운영체제별 의존성 별로 캐시 구분
          # node: node.js 모듈을 캐시한다는 의미로 사용
          # hashFiles('**/package-lock.json'): package-lock.json 파일이 변결될때마다 값이 바뀜
            # 의존성이 변경되었을 시 새로운 캐시를 생성하기 위함
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          # 캐시 복구를 위한 키
          # 키가 정확히 일치하는 캐시가 없는 경우 가장 가까운 캐시 사용
          restore-keys: | 
            ${{ runner.os}}-node-

      - name: Install dependencies
        run: |
          cd my-app
          npm ci
      - name: npm build
        run: |
          cd my-app
          npm run build
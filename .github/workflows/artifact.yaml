name: artifact
on: push

jobs:
  upload-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: echo
        run: echo hello-world > hello.txt
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-test
          path: ./hello.txt

  download-artifiact:
    runs-on: ubuntu-latest
    needs: [upload-artifact] # 종속성 설정
    steps:
      - name: download artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact-test
          path: ./
      - name: check
        run: cat hello.txt